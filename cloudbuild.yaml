steps:
  - name: rust:1-slim
    entrypoint: bash
    env:
      - 'PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
    args:
      - -c
      - |
        set -euo pipefail
        rustup target add wasm32-unknown-unknown
        cargo install wasm-pack
        wasm-pack build crates/fireworks-wasm --target web --out-dir ../../src/lib/fireworks-wasm

  - name: node:24
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        # Pin pnpm: newer majors no longer read package.json's "pnpm" field
        # and reject this lockfile.
        npm i -g pnpm@10.34.6
        pnpm install --frozen-lockfile
        pnpm exec vite build

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["app", "deploy", "app.yaml", "--quiet"]
